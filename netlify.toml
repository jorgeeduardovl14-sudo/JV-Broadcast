[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self)"

[[redirects]]
  from = "/camera"
  to = "/studio.html"
  status = 200

[[redirects]]
  from = "/control"
  to = "/control.html"
  status = 200
